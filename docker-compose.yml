x-common: &common
  environment:
    GOOGLE_CLOUD_PROJECT: project-e8f5a204-d5ce-4c07-9c7
  # Dockerfile defaults to an interactive shell; run the HTTP server instead
  command: ["-c", "source /home/app/.venv/bin/activate && uvicorn server:app --host 0.0.0.0 --port 8000"]

services:
  transcribe-audio:
    <<: *common
    build: ./transcribe_audio
    volumes: ["./transcribe_audio:/app"]
  generate-text:
    <<: *common
    build: ./generate_text
    volumes: ["./generate_text:/app"]
  translate-text:
    <<: *common
    build: ./translate_text
    volumes: ["./translate_text:/app"]
  synthesis-audio:
    <<: *common
    build: ./synthesis_audio
    volumes: ["./synthesis_audio:/app"]
  orchestrator:
    build: ./orchestrator
    ports: ["9000:8000"]
    volumes:
      - ./orchestrator:/app   # classifier reads secrets/ for Gemini
      - ./web:/web:ro         # static UI served at http://localhost:9000
    environment:
      WEB_DIR: /web
      # Add the deployed UI origin here (comma separated) when the UI is hosted elsewhere, e.g. Vercel
      ALLOWED_ORIGINS: http://localhost:9000,http://127.0.0.1:9000
    depends_on: [transcribe-audio, generate-text, translate-text, synthesis-audio]
